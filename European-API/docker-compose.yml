services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-dados:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: european
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  mongo-dados:
